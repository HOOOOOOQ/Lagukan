# Lagukan Music Bot - Docker Compose
# Includes: Lagukan Bot and MongoDB
# Requires: External Lavalink server (configure via LAVALINK_* env vars)

services:
    # ================================
    # Lagukan Discord Bot
    # ================================
    lagukan:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: lagukan-bot
        restart: unless-stopped
        environment:
            # General Configuration
            - BOT_NAME=${BOT_NAME:-Lagukan}
            - TOKEN=${TOKEN}
            - PREFIX=${PREFIX:-!}
            - EMBED_COLOR=${EMBED_COLOR:-5865F2}
            - LEAVE_TIMEOUT=${LEAVE_TIMEOUT:-60000}
            - DEFAULT_VOLUME=${DEFAULT_VOLUME:-100}
            - MIN_VOLUME=${MIN_VOLUME:-1}
            - MAX_VOLUME=${MAX_VOLUME:-100}
            - MONGO_URI=mongodb://mongodb:27017/lagukan
            - SUPPORT_SERVER_URL=${SUPPORT_SERVER_URL}
            - DEBUG=${DEBUG:-false}
            # Voice Activity Logger Configuration
            - VOICE_LOG_ENABLED=${VOICE_LOG_ENABLED:-true}
            - TIMEZONE=${TIMEZONE:-Asia/Jakarta}
            # Lavalink Connection
            - LAVALINK_NAME=${LAVALINK_NAME:-Lagukan}
            - LAVALINK_HOST=${LAVALINK_HOST:-host.docker.internal}
            - LAVALINK_PORT=${LAVALINK_PORT:-2333}
            - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
            - LAVALINK_SECURE=${LAVALINK_SECURE:-false}
            - LAVALINK_DRIVER=${LAVALINK_DRIVER:-lavalink/v4/koinu}
            # Rainlink Configuration
            - LAVALINK_SOURCE=${LAVALINK_SOURCE:-sp}
            - DEFAULT_SEARCH_ENGINE=${DEFAULT_SEARCH_ENGINE:-youtubeMusic}
            - SEARCH_FALLBACK_ENGINE=${SEARCH_FALLBACK_ENGINE:-youtube}
        depends_on:
            mongodb:
                condition: service_healthy
        networks:
            - lagukan-network

    # ================================
    # MongoDB Database
    # ================================
    mongodb:
        image: mongo:7
        container_name: lagukan-mongodb
        restart: unless-stopped
        volumes:
            - mongodb_data:/data/db
        environment:
            - MONGO_INITDB_DATABASE=lagukan
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - lagukan-network

# ================================
# Networks
# ================================
networks:
    lagukan-network:
        driver: bridge

# ================================
# Volumes
# ================================
volumes:
    mongodb_data:
        driver: local
